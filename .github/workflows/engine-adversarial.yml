name: Engine adversarial command safety

on:
  pull_request:
    paths:
      - "crates/engine/**"
      - ".github/workflows/engine-adversarial.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 0"

permissions:
  contents: read

concurrency:
  group: engine-adversarial-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  invalid-command-parameters:
    name: Full command registry panic/hang regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-panic-hunt
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The upstream test is intentionally ignored in regular cargo test because
      # it traverses the full registry. Run it explicitly instead of reporting skipped.
      - name: Adversarial parameters for every registered command
        run: cargo test -p photocraft-engine --locked --test panic_hunt -- --ignored --nocapture
